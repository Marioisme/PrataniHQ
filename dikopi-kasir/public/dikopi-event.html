<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dikopi Kasir Event - Cloud Sync POS</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  
  <!-- Firebase Compat SDK (CDN) — Firestore -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #ff9f43;
      --green: #4cc9a0;
      --red: #ff4757;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .title { font-size: 20px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge { background: rgba(255, 159, 67, 0.15); color: var(--accent); font-size: 11px; padding: 4px 10px; border-radius: 99px; font-weight: 600; border: 1px solid rgba(255, 159, 67, 0.3); }
    .cloud-badge { background: rgba(76, 201, 160, 0.15); color: var(--green); border-color: rgba(76, 201, 160, 0.3); }
    .error-badge { background: rgba(255, 71, 87, 0.15); color: var(--red); border-color: rgba(255, 71, 87, 0.3); }
    
    .btn { background: var(--accent); color: #000; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s opacity; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
    .btn:hover { opacity: 0.9; }
    .btn-green { background: var(--green); color: #000; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-red { background: var(--red); color: #fff; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    
    .grid { display: grid; grid-template-columns: 1fr 340px; gap: 16px; }
    @media (max-width: 850px) { .grid { grid-template-columns: 1fr; } }
    
    /* Channel & Category Tabs */
    .filter-bar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .filter-tab { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.15s all; }
    .filter-tab:hover { border-color: var(--accent); color: var(--text); }
    .filter-tab.active { background: rgba(255,159,67,0.15); border-color: var(--accent); color: var(--accent); }

    /* Search */
    .search-box { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: 12px; margin-bottom: 12px; outline: none; }
    .search-box:focus { border-color: var(--accent); }
    .search-box::placeholder { color: var(--muted); }

    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; max-height: 55vh; overflow-y: auto; padding-right: 4px; }
    .menu-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; cursor: pointer; transition: 0.15s transform, 0.15s border-color; position: relative; }
    .menu-card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .menu-card:active { transform: scale(0.97); }
    .menu-name { font-weight: 600; font-size: 12px; margin-bottom: 4px; line-height: 1.3; }
    .menu-price { color: var(--green); font-family: 'DM Mono', monospace; font-size: 13px; }
    .menu-hpp { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 10px; }
    .menu-kategori { position: absolute; top: 6px; right: 6px; background: rgba(255,255,255,0.06); color: var(--muted); font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
    
    .cart-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; height: fit-content; position: sticky; top: 16px; }
    .cart-title { font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .cart-items { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; font-size: 12px; background: rgba(255,255,255,0.03); padding: 8px; border-radius: 6px; }
    .cart-item-qty { display: flex; align-items: center; gap: 6px; }
    .qty-btn { background: var(--border); color: #fff; border: none; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 700; }
    .qty-btn:hover { background: var(--accent); color: #000; }
    
    .total-row { display: flex; justify-content: space-between; font-weight: 700; font-size: 16px; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px; }

    /* Cashier & Payment */
    .input-row { display: flex; gap: 8px; }
    .input-row input, .input-row select { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--text); font-size: 11px; outline: none; }
    .input-row input:focus, .input-row select:focus { border-color: var(--accent); }
    .input-row select { cursor: pointer; }
    .input-row select option { background: var(--bg); }
    
    .live-list { margin-top: 24px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .live-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .live-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .live-table th { text-align: left; padding: 8px; color: var(--muted); border-bottom: 1px solid var(--border); }
    .live-table td { padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .status-tag { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
    .status-pending { background: rgba(255, 159, 67, 0.2); color: var(--accent); }
    .status-synced { background: rgba(76, 201, 160, 0.2); color: var(--green); }

    .live-summary { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
    .live-stat { background: rgba(255,255,255,0.03); padding: 8px 14px; border-radius: 8px; font-size: 12px; }
    .live-stat .val { font-family: 'DM Mono', monospace; font-weight: 700; color: var(--green); font-size: 14px; }

    .toast { position: fixed; bottom: 20px; right: 20px; background: var(--card); border: 1px solid var(--accent); color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 500; display: none; z-index: 99; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 380px; }

    .loading-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--muted); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state { text-align: center; color: var(--muted); padding: 30px; font-size: 13px; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="title">
      ☕ Dikopi Kasir Event <span class="badge cloud-badge" id="envBadge"><span class="loading-spinner"></span> Menghubungkan...</span>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn btn-outline" onclick="retryLocalSync()" title="Kirim transaksi offline ke Cloud">📤 Retry Offline (<span id="offlineCount">0</span>)</button>
      <button class="btn btn-outline" onclick="location.reload()">🔄 Refresh</button>
    </div>
  </div>

  <div class="grid">
    <!-- MENU SELECTION -->
    <div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <div style="font-size:14px; font-weight:600; color:var(--muted)">DAFTAR MENU</div>
        <div style="font-size:11px; color:var(--green)" id="menuSourceTag"><span class="loading-spinner"></span> Memuat menu...</div>
      </div>
      <!-- Channel Filter -->
      <div class="filter-bar" id="channelFilter"></div>
      <!-- Kategori Filter -->
      <div class="filter-bar" id="kategoriFilter"></div>
      <!-- Search -->
      <input type="text" class="search-box" id="searchBox" placeholder="🔍 Cari menu..." oninput="renderMenu()">
      <!-- Menu Grid -->
      <div class="menu-grid" id="menuGrid">
        <div class="empty-state"><span class="loading-spinner"></span> Memuat menu dari cloud...</div>
      </div>
    </div>

    <!-- CART & CHECKOUT -->
    <div class="cart-box">
      <div class="cart-title">
        <span>🛒 Pesanan</span>
        <span style="font-size:12px; color:var(--muted)" id="itemCount">0 item</span>
      </div>
      <div class="cart-items" id="cartItems">
        <div class="empty-state">Keranjang kosong</div>
      </div>
      <div class="total-row">
        <span>Total:</span>
        <span style="color:var(--green); font-family:'DM Mono',monospace" id="cartTotal">Rp 0</span>
      </div>
      <!-- Cashier Name & Payment -->
      <div class="input-row">
        <input type="text" id="cashierName" placeholder="👤 Nama Kasir" value="">
        <select id="paymentMethod">
          <option value="cash">💵 Cash</option>
          <option value="qris">📱 QRIS</option>
          <option value="transfer">🏦 Transfer</option>
        </select>
      </div>
      <button class="btn" style="width:100%; justify-content:center; padding:12px;" id="submitBtn" onclick="submitOrder()">⚡ Simpan Transaksi</button>
      <button class="btn btn-outline" style="width:100%; justify-content:center; padding:8px; font-size:11px;" onclick="clearCart()">🗑️ Kosongkan Keranjang</button>
    </div>
  </div>

  <!-- LIVE TRANSACTIONS -->
  <div class="live-list">
    <div class="live-header">
      <div style="font-weight:700; font-size:14px;">📡 Live Transaksi Hari Ini (Realtime)</div>
      <div style="font-size:12px; color:var(--muted)" id="liveCount">0 Transaksi</div>
    </div>
    <div class="live-summary" id="liveSummary"></div>
    <table class="live-table">
      <thead>
        <tr>
          <th>Waktu</th>
          <th>Deskripsi Order</th>
          <th>Nominal</th>
          <th>Bayar</th>
          <th>Kasir</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="liveTableBody">
        <tr><td colspan="6" class="empty-state"><span class="loading-spinner"></span> Memuat transaksi...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="toast" id="toastMsg"></div>

  <script>
    // ════════════════════════════════════════════════════════════════
    // 1. FIREBASE CONFIGURATION — Project: kasir-dikopi (Firestore)
    // ════════════════════════════════════════════════════════════════
    const FB_CONFIG = {
      apiKey: "AIzaSyA0vR9gLFIG_dKE6T_0DhPc-vqYZBjsqc0",
      authDomain: "kasir-dikopi.firebaseapp.com",
      projectId: "kasir-dikopi",
      storageBucket: "kasir-dikopi.firebasestorage.app",
      messagingSenderId: "801730874094",
      appId: "1:801730874094:web:6114dcdf24f1d65c6a81ff"
    };

    let fbDb = null;
    let firebaseActive = false;

    try {
      if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
      fbDb = firebase.firestore();
      firebaseActive = true;
      setBadge('☁️ Firestore Connected', 'cloud');
    } catch(e) {
      console.error("Firebase init error:", e);
      setBadge('⚠️ Offline Mode', 'error');
    }

    function setBadge(text, type) {
      const el = document.getElementById('envBadge');
      el.textContent = text;
      el.className = 'badge ' + (type === 'cloud' ? 'cloud-badge' : type === 'error' ? 'error-badge' : 'badge');
    }

    // ════════════════════════════════════════════════════════════════
    // 2. MENU ENGINE — Load from Firestore dikopi_resep
    // ════════════════════════════════════════════════════════════════
    let MENU = [];
    let cart = {};
    let activeChannel = 'all';
    let activeKategori = 'all';

    async function loadMenu() {
      // Try Firestore first
      if (firebaseActive && fbDb) {
        try {
          const snap = await fbDb.collection('dikopi_resep').get();
          if (!snap.empty) {
            MENU = snap.docs.map(doc => {
              const d = doc.data();
              return {
                id: doc.id,
                name: d.nama || '',
                price: Number(d.hargaJual) || 0,
                hpp: Number(d.hppSnapshot) || 0,
                kategori: d.kategori || '',
                channel: d.channel || 'kedai',
                catatan: d.catatan || ''
              };
            });
            // Sort by kategori then name
            MENU.sort((a, b) => a.kategori.localeCompare(b.kategori) || a.name.localeCompare(b.name));
            document.getElementById('menuSourceTag').textContent = `☁️ ${MENU.length} menu dari Firestore`;
            buildFilters();
            renderMenu();
            saveCacheMenu();
            return;
          }
        } catch(e) {
          console.warn("Firestore menu load error:", e);
        }
      }

      // Fallback: localStorage cache
      const cached = localStorage.getItem('dikopi_menu_cache');
      if (cached) {
        try {
          MENU = JSON.parse(cached);
          document.getElementById('menuSourceTag').textContent = `💾 ${MENU.length} menu dari cache`;
          buildFilters();
          renderMenu();
          return;
        } catch(e) {}
      }

      // Ultimate fallback: static menu
      MENU = [
        { id: 'm1', name: 'Kopi Susu', price: 12000, hpp: 3253, kategori: 'Coffee', channel: 'kedai' },
        { id: 'm2', name: 'Gula Aren', price: 13000, hpp: 3876, kategori: 'Coffee', channel: 'kedai' },
        { id: 'm3', name: 'Americano Robusta', price: 10000, hpp: 1838, kategori: 'Coffee', channel: 'kedai' },
        { id: 'm4', name: 'Butterscotch Latte', price: 13000, hpp: 5146, kategori: 'Coffee', channel: 'kedai' },
        { id: 'm5', name: 'Caramel Latte', price: 13000, hpp: 5123, kategori: 'Coffee', channel: 'kedai' },
        { id: 'm6', name: 'Matcha', price: 10000, hpp: 2408, kategori: 'Non Coffee', channel: 'kedai' },
        { id: 'm7', name: 'Cokelat', price: 10000, hpp: 2048, kategori: 'Non Coffee', channel: 'kedai' },
        { id: 'm8', name: 'Red Velvet', price: 10000, hpp: 2048, kategori: 'Non Coffee', channel: 'kedai' },
        { id: 'm9', name: 'Hazelnut', price: 10000, hpp: 2348, kategori: 'Non Coffee', channel: 'kedai' },
        { id: 'm10', name: 'Bakso Bakar', price: 10000, hpp: 3600, kategori: 'Snack', channel: 'kedai' }
      ];
      document.getElementById('menuSourceTag').textContent = '⚠️ Menu statis fallback';
      buildFilters();
      renderMenu();
    }

    function saveCacheMenu() {
      try { localStorage.setItem('dikopi_menu_cache', JSON.stringify(MENU)); } catch(e) {}
    }

    // ── Build Channel & Kategori Filter Tabs ──
    function buildFilters() {
      const channels = [...new Set(MENU.map(m => m.channel))].sort();
      const kategories = [...new Set(MENU.map(m => m.kategori).filter(Boolean))].sort();

      const chMap = { kedai: '🏠 Kedai', cfd: '🛣️ CFD', marketplace: '🛒 Marketplace', tiktokgo: '📱 TikTokGo' };

      let chHTML = `<div class="filter-tab active" onclick="setChannel('all')">Semua (${MENU.length})</div>`;
      channels.forEach(ch => {
        const count = MENU.filter(m => m.channel === ch).length;
        const label = chMap[ch] || ch;
        chHTML += `<div class="filter-tab" onclick="setChannel('${ch}')">${label} (${count})</div>`;
      });
      document.getElementById('channelFilter').innerHTML = chHTML;

      let katHTML = `<div class="filter-tab active" onclick="setKategori('all')">Semua Kategori</div>`;
      kategories.forEach(k => {
        katHTML += `<div class="filter-tab" onclick="setKategori('${k}')">${k}</div>`;
      });
      document.getElementById('kategoriFilter').innerHTML = katHTML;
    }

    function setChannel(ch) {
      activeChannel = ch;
      document.querySelectorAll('#channelFilter .filter-tab').forEach(el => {
        el.classList.toggle('active', el.textContent.includes(ch === 'all' ? 'Semua (' : ch));
      });
      // Reset active state properly
      const tabs = document.querySelectorAll('#channelFilter .filter-tab');
      tabs.forEach((el, i) => {
        if (ch === 'all') el.classList.toggle('active', i === 0);
        else el.classList.toggle('active', el.getAttribute('onclick').includes(`'${ch}'`) && i > 0);
      });
      renderMenu();
    }

    function setKategori(k) {
      activeKategori = k;
      const tabs = document.querySelectorAll('#kategoriFilter .filter-tab');
      tabs.forEach((el, i) => {
        if (k === 'all') el.classList.toggle('active', i === 0);
        else el.classList.toggle('active', el.getAttribute('onclick').includes(`'${k}'`) && i > 0);
      });
      renderMenu();
    }

    // ── Render Menu Grid ──
    function renderMenu() {
      const search = (document.getElementById('searchBox')?.value || '').toLowerCase();
      const filtered = MENU.filter(m => {
        if (activeChannel !== 'all' && m.channel !== activeChannel) return false;
        if (activeKategori !== 'all' && m.kategori !== activeKategori) return false;
        if (search && !m.name.toLowerCase().includes(search)) return false;
        return true;
      });

      const el = document.getElementById('menuGrid');
      if (filtered.length === 0) {
        el.innerHTML = '<div class="empty-state">Tidak ada menu yang cocok</div>';
        return;
      }
      el.innerHTML = filtered.map(m => `
        <div class="menu-card" onclick="addToCart('${m.id}')">
          <div class="menu-kategori">${m.kategori}</div>
          <div class="menu-name">${m.name}</div>
          <div class="menu-price">Rp ${Number(m.price).toLocaleString('id-ID')}</div>
          <div class="menu-hpp">HPP: Rp ${Number(m.hpp).toLocaleString('id-ID')}</div>
        </div>
      `).join('');
    }

    // ── Cart Logic ──
    function addToCart(id) {
      if (cart[id]) { cart[id].qty++; }
      else {
        const item = MENU.find(m => String(m.id) === String(id));
        if (item) cart[id] = { ...item, qty: 1 };
      }
      renderCart();
    }

    function updateQty(id, delta) {
      if (!cart[id]) return;
      cart[id].qty += delta;
      if (cart[id].qty <= 0) delete cart[id];
      renderCart();
    }

    function clearCart() {
      cart = {};
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cartItems');
      const items = Object.values(cart);
      let total = 0;
      let count = 0;

      if (items.length === 0) {
        container.innerHTML = '<div class="empty-state">Keranjang kosong</div>';
      } else {
        container.innerHTML = items.map(item => {
          const sub = item.price * item.qty;
          total += sub;
          count += item.qty;
          return `
            <div class="cart-item">
              <div>
                <div style="font-weight:600">${item.name}</div>
                <div style="color:var(--muted); font-size:11px">Rp ${Number(item.price).toLocaleString('id-ID')} × ${item.qty} = <span style="color:var(--green)">Rp ${sub.toLocaleString('id-ID')}</span></div>
              </div>
              <div class="cart-item-qty">
                <button class="qty-btn" onclick="updateQty('${item.id}', -1)">−</button>
                <span style="font-family:'DM Mono',monospace; min-width:20px; text-align:center">${item.qty}</span>
                <button class="qty-btn" onclick="updateQty('${item.id}', 1)">+</button>
              </div>
            </div>
          `;
        }).join('');
      }

      document.getElementById('cartTotal').textContent = 'Rp ' + total.toLocaleString('id-ID');
      document.getElementById('itemCount').textContent = count + ' item';
    }

    // ════════════════════════════════════════════════════════════════
    // 3. SUBMIT ORDER → Firestore dikopi_transaksi
    // ════════════════════════════════════════════════════════════════
    async function submitOrder() {
      const items = Object.values(cart);
      if (items.length === 0) { showToast('⚠️ Keranjang masih kosong!'); return; }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner"></span> Menyimpan...';

      const totalNominal = items.reduce((acc, i) => acc + (i.price * i.qty), 0);
      const totalHPP = items.reduce((acc, i) => acc + (i.hpp * i.qty), 0);
      const descItems = items.map(i => `${i.name} (${i.qty}x)`).join(', ');
      const cashier = document.getElementById('cashierName').value.trim() || 'Kasir Event';
      const payment = document.getElementById('paymentMethod').value;

      // Save cashier name for next time
      try { localStorage.setItem('dikopi_cashier', cashier); } catch(e) {}

      const payload = {
        id: Date.now(),
        tanggal: new Date().toISOString().split('T')[0],
        deskripsi: descItems,
        kategori: 'Penjualan Langsung',
        tipe: 'masuk',
        sumber: payment,
        nominal: totalNominal,
        items: items.map(i => ({
          name: i.name,
          qty: i.qty,
          price: i.price,
          subtotal: i.price * i.qty,
          hppSnapshot: i.hpp || 0
        })),
        _source: 'kasir_event',
        _hppTotal: totalHPP,
        event_name: 'Kasir Event Cloud',
        cashier_name: cashier,
        synced: false,
        created_at: new Date().toISOString()
      };

      let success = false;

      // Primary: Firestore direct write
      if (firebaseActive && fbDb) {
        try {
          await fbDb.collection('dikopi_transaksi').doc(String(payload.id)).set(payload);
          success = true;
          showToast(`⚡ Transaksi Rp ${totalNominal.toLocaleString('id-ID')} berhasil disimpan ke Cloud!`);
        } catch(err) {
          console.error("Firestore write error:", err);
        }
      }

      // Fallback: localStorage offline queue
      if (!success) {
        saveToOfflineQueue(payload);
        showToast('⚠️ Tersimpan di antrian offline. Akan dikirim saat koneksi pulih.');
      }

      cart = {};
      renderCart();
      btn.disabled = false;
      btn.innerHTML = '⚡ Simpan Transaksi';
    }

    // ── Offline Queue ──
    function saveToOfflineQueue(payload) {
      let queue = JSON.parse(localStorage.getItem('dikopi_offline_queue') || '[]');
      queue.push(payload);
      localStorage.setItem('dikopi_offline_queue', JSON.stringify(queue));
      updateOfflineCount();
    }

    function updateOfflineCount() {
      const queue = JSON.parse(localStorage.getItem('dikopi_offline_queue') || '[]');
      document.getElementById('offlineCount').textContent = queue.length;
    }

    async function retryLocalSync() {
      const queue = JSON.parse(localStorage.getItem('dikopi_offline_queue') || '[]');
      if (queue.length === 0) { showToast('✅ Tidak ada transaksi offline yang perlu dikirim.'); return; }
      if (!firebaseActive || !fbDb) { showToast('⚠️ Firebase belum terhubung. Coba refresh halaman.'); return; }

      showToast(`📤 Mengirim ${queue.length} transaksi offline ke Cloud...`);
      let sent = 0;
      const failed = [];

      for (const payload of queue) {
        try {
          await fbDb.collection('dikopi_transaksi').doc(String(payload.id)).set(payload);
          sent++;
        } catch(e) {
          failed.push(payload);
        }
      }

      localStorage.setItem('dikopi_offline_queue', JSON.stringify(failed));
      updateOfflineCount();
      showToast(`✅ ${sent} transaksi berhasil dikirim! ${failed.length > 0 ? `⚠️ ${failed.length} gagal.` : ''}`);
    }

    // ════════════════════════════════════════════════════════════════
    // 4. REALTIME LISTENER — Firestore onSnapshot (Hari Ini)
    // ════════════════════════════════════════════════════════════════
    function initRealtimeListener() {
      if (!firebaseActive || !fbDb) {
        renderOfflineFallback();
        return;
      }

      // Query: transaksi hari ini, ordered by created_at desc
      const todayStr = new Date().toISOString().split('T')[0];

      fbDb.collection('dikopi_transaksi')
        .where('tanggal', '==', todayStr)
        .orderBy('created_at', 'desc')
        .onSnapshot(snapshot => {
          const tbody = document.getElementById('liveTableBody');
          
          if (snapshot.empty) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Belum ada transaksi hari ini</td></tr>';
            document.getElementById('liveCount').textContent = '0 Transaksi';
            document.getElementById('liveSummary').innerHTML = '';
            return;
          }

          const list = snapshot.docs.map(doc => doc.data());
          document.getElementById('liveCount').textContent = list.length + ' Transaksi';

          // Summary stats
          const totalOmzet = list.reduce((s, t) => s + (Number(t.nominal) || 0), 0);
          const totalHPP = list.reduce((s, t) => s + (Number(t._hppTotal) || 0), 0);
          const totalItems = list.reduce((s, t) => s + (t.items ? t.items.reduce((a, i) => a + i.qty, 0) : 0), 0);
          const margin = totalOmzet - totalHPP;
          const marginPct = totalOmzet > 0 ? ((margin / totalOmzet) * 100).toFixed(1) : '0';

          document.getElementById('liveSummary').innerHTML = `
            <div class="live-stat">Omzet<br><span class="val">Rp ${totalOmzet.toLocaleString('id-ID')}</span></div>
            <div class="live-stat">HPP<br><span class="val" style="color:var(--red)">Rp ${totalHPP.toLocaleString('id-ID')}</span></div>
            <div class="live-stat">Margin<br><span class="val">Rp ${margin.toLocaleString('id-ID')} (${marginPct}%)</span></div>
            <div class="live-stat">Cup/Item<br><span class="val">${totalItems}</span></div>
          `;

          const payIcon = { cash: '💵', qris: '📱', transfer: '🏦' };

          tbody.innerHTML = list.map(t => `
            <tr>
              <td>${new Date(t.created_at || t.id).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}</td>
              <td><strong>${t.deskripsi}</strong></td>
              <td style="color:var(--green); font-family:'DM Mono',monospace; font-weight:600">Rp ${Number(t.nominal).toLocaleString('id-ID')}</td>
              <td>${payIcon[t.sumber] || '💵'} ${t.sumber || 'cash'}</td>
              <td>${t.cashier_name || 'Kasir'}</td>
              <td>
                ${t.synced 
                  ? '<span class="status-tag status-synced">✅ Synced HQ</span>' 
                  : '<span class="status-tag status-pending">☁️ Cloud</span>'}
              </td>
            </tr>
          `).join('');
        }, err => {
          console.error("Realtime listener error:", err);
          // Fallback: single fetch without orderBy (in case index not ready)
          fallbackFetchToday();
        });
    }

    async function fallbackFetchToday() {
      try {
        const todayStr = new Date().toISOString().split('T')[0];
        const snap = await fbDb.collection('dikopi_transaksi').where('tanggal', '==', todayStr).get();
        const list = snap.docs.map(d => d.data()).sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
        const tbody = document.getElementById('liveTableBody');
        
        if (list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Belum ada transaksi hari ini</td></tr>';
          return;
        }

        document.getElementById('liveCount').textContent = list.length + ' Transaksi (snapshot)';
        const payIcon = { cash: '💵', qris: '📱', transfer: '🏦' };
        tbody.innerHTML = list.map(t => `
          <tr>
            <td>${new Date(t.created_at || t.id).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}</td>
            <td><strong>${t.deskripsi}</strong></td>
            <td style="color:var(--green); font-family:'DM Mono',monospace; font-weight:600">Rp ${Number(t.nominal).toLocaleString('id-ID')}</td>
            <td>${payIcon[t.sumber] || '💵'} ${t.sumber || 'cash'}</td>
            <td>${t.cashier_name || 'Kasir'}</td>
            <td><span class="status-tag status-pending">☁️ Cloud</span></td>
          </tr>
        `).join('');
      } catch(e) {
        console.error("Fallback fetch error:", e);
        renderOfflineFallback();
      }
    }

    function renderOfflineFallback() {
      const tbody = document.getElementById('liveTableBody');
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">⚠️ Tidak terhubung ke Cloud. Transaksi disimpan secara offline.</td></tr>';
      document.getElementById('liveCount').textContent = 'Offline';
    }

    // ════════════════════════════════════════════════════════════════
    // 5. UTILS & INIT
    // ════════════════════════════════════════════════════════════════
    function showToast(msg) {
      const t = document.getElementById('toastMsg');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.style.display = 'none'; }, 4500);
    }

    // Restore cashier name
    const savedCashier = localStorage.getItem('dikopi_cashier');
    if (savedCashier) document.getElementById('cashierName').value = savedCashier;

    // Boot
    updateOfflineCount();
    loadMenu();
    initRealtimeListener();
  </script>
</body>
</html>
